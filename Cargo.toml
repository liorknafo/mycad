[workspace]
resolver = "2"
members = [
    "crates/mycad-kernel",
    "crates/mycad-renderer",
    "crates/mycad-ui",
    "crates/mycad-app",
]

[workspace.dependencies]
# Math
glam = { version = "0.29", features = ["serde"] }
nalgebra = "0.33"

# Rendering
wgpu = "24"
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["wgpu"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
petgraph = "0.7"
uuid = { version = "1", features = ["v4", "serde", "js"] }
ron = "0.8"

# Testing
approx = "0.5"

# Internal crates
mycad-kernel = { path = "crates/mycad-kernel" }
mycad-renderer = { path = "crates/mycad-renderer" }
mycad-ui = { path = "crates/mycad-ui" }
mycad-app = { path = "crates/mycad-app" }
